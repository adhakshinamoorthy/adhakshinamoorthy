<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Dhakshinamoorthy A — Cloud and .NET Solutions Leader</title>
  <desc id="description">A dark blue and purple architecture-themed banner with connected nodes.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091426" />
      <stop offset="0.52" stop-color="#172554" />
      <stop offset="1" stop-color="#512bd4" />
